<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kero - Iniciar Sesión</title>

    <!-- Tipografía Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Kero/img/logo-icono.png">

    <link rel="stylesheet" href="../css/login.css?v=99">
</head>
<body class="body-login">

    <main class="contenedor-login">
        <header class="cabecera-login">
            <h1 class="logo-kero">Kero</h1>
            <h2>Ingresar a Kero</h2>
        </header>

        <!-- ACTION con la ruta exacta /Kero/ -->
        <form action="/Kero/modules/procesar_login.php" method="POST" class="form-login">
            
            <div class="campo-form">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com" class="input-form">
            </div>

            <div class="campo-form">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Tu contraseña" class="input-form">
            </div>

            <p class="campo-boton">
                <button type="submit" class="btn-login">Entrar</button>
            </p>
            
        </form>

        <footer class="pie-login">
         <p>¿No tienes cuenta? <a href="../index.html#perfiles" class="enlace-registro">Regístrate aquí</a></p>
        </footer>
    </main>

    <!-- VENTANA MODAL DE NOTIFICACIÓN -->
    <div id="modal-notificacion" class="modal-overlay">
        <div class="modal-caja">
            <div id="modal-icono" class="modal-icono">⚠️</div>
            <h3 id="modal-titulo">¡Atención!</h3>
            <p id="modal-mensaje">Mensaje de error o éxito...</p>
            <button type="button" id="btn-cerrar-modal" class="btn-modal">Entendido</button>
        </div>
    </div>

    <!-- SCRIPT con la ruta exacta /Kero/ -->
    <script src="/Kero/js/alerta.js"></script>

</body>
</html>
